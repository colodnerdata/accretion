[project]
name = "accretion"
version = "0.1.0"
description = "Reference simulation for the Accretion idle game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "poethepoet>=0.49.0,<1",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.3,<1",
]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accretion"]

[tool.poe.env]
UV_LOCKED = "1"

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
test = "pytest"
check = ["lint", "format-check", "test"]
launch = "python tools/launch.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 88
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "B", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"tools/*" = ["D"]
