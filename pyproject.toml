[project]
name = "accretion"
version = "0.1.0"
description = "Reference simulation for the Accretion idle game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "playwright>=1.50.0,<2",
    "poethepoet>=0.49.0,<1",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.3,<1",
]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accretion"]

[tool.poe.env]
UV_LOCKED = "1"

# Shortcuts for the owner. Automated layers (CI, the git hook, Claude Code
# hooks) call the uv commands in docs/DEVELOPMENT.md directly.
[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
build-check = "python tools/build.py --check"
test = "pytest -m 'not property'"
check = ["lint", "format-check", "build-check", "test"]
launch = "python tools/launch.py"
audit = "python tools/audit.py --out docs/audit/report.md"
setup = [
    { cmd = "uv sync --locked" },
    { cmd = "git config core.hooksPath .githooks" },
]
# Older name for the hook step of `setup`; CLAUDE.md still names it.
hooks = "git config core.hooksPath .githooks"

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "browser: drives the built page in Chromium; applied by tests/conftest.py",
    "property: property-based tests, run as their own CI job once they exist",
]

[tool.ruff]
line-length = 88
# Skills are markdown for Claude, not project code; the hooks are linted.
extend-exclude = [".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "B", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
known-first-party = ["accretion", "text"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"tools/*" = ["D"]
# Copied unchanged from solo-project-template, which has no D rules.
".claude/hooks/*" = ["D"]
