<div id="app">
  <div id="stage">
    <canvas id="sky" tabindex="0" role="button" aria-label="{{ui.aria.sky_tap}}"></canvas>
    <div class="hud" id="brand"><h1>{{ui.brand}}</h1><div id="track"></div></div>
    <div class="hud" id="scale"><i></i><span id="scale-label"></span></div>
    <div class="hud" id="hint">{{ui.gather_hint}}</div>
  </div>
  <aside id="panel" aria-live="off"></aside>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
