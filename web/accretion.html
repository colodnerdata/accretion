<title>Accretion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a live telescope view with an instrument panel beside it, stacked on phones.
   A single dark look, using narrowband emission-line colors. */
:root {
  --void: #0c0a1c; --panel: #151230; --raise: #201c43; --line: #3a3468;
  --ink: #f1edff; --quiet: #b1a9d6; --dwarf: #c9785f;
  --halpha: #ff5f7e; --oiii: #5fe6cf; --sii: #ffb86b;
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font: 15px/1.45 var(--display); overflow: hidden; }
#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
#stage { position: relative; min-width: 0; min-height: 0; touch-action: manipulation; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
#sky:focus-visible { outline: 2px solid var(--oiii); outline-offset: -4px; }
.hud { position: absolute; pointer-events: none; text-shadow: 0 0 6px var(--void), 0 0 2px var(--void); }
#brand { top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); }
#brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .24em; }
#track { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font: 11.5px var(--data); color: var(--quiet); }
#track .now { color: var(--halpha); }
#track .done { color: var(--ink); }
#scale { bottom: 14px; left: max(16px, env(safe-area-inset-left, 0px)); font: 12px var(--data); color: var(--ink); }
#scale i { display: block; width: 96px; height: 2px; margin-bottom: 5px; background: var(--ink); }
#hint { left: 50%; bottom: 14px; transform: translateX(-50%); font: 12px var(--data); color: var(--oiii); white-space: nowrap; }
#panel { --pad: 18px; min-width: 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
  background: var(--panel); border-left: 1px solid var(--line); padding-block: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#panel section { display: flex; flex-direction: column; gap: 8px; }
h2 { margin: 0; font-size: 22px; line-height: 1.15; font-weight: 700; text-wrap: balance; }
h3 { margin: 0; font: 500 11.5px var(--data); letter-spacing: .1em; text-transform: uppercase; color: var(--quiet); }
p { margin: 0; color: var(--quiet); }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 0; font: 13px var(--data); }
.stats dt { color: var(--quiet); }
.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.meter { height: 8px; background: var(--raise); }
.meter i { display: block; height: 100%; width: 0; background: var(--halpha); }
.meter-note { display: flex; justify-content: space-between; gap: 8px; font: 12px var(--data); color: var(--quiet); }
.upgrades { display: flex; flex-direction: column; gap: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--oiii); outline-offset: 2px; }
/* One row per control in the play panel: name and level outside the button,
   effect text, and a buy button carrying the cost. */
.control { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; align-items: center;
  background: var(--raise); border: 1px solid var(--line); padding: 8px 10px; }
.control .u-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; grid-column: 1; }
.control .u-head b { font-weight: 600; }
.control.ready .u-head b { color: var(--oiii); }
.control .level { color: var(--quiet); font: 12px var(--data); white-space: nowrap; }
.control small { color: var(--ink); font-size: 12.5px; grid-column: 1; }
.control .buy { grid-column: 2; grid-row: 1 / span 2; align-self: center; justify-self: end; min-width: 9em;
  text-align: right; font: 12px var(--data); padding: 6px 10px; background: var(--raise); border: 1px solid var(--line);
  background-image: linear-gradient(90deg, rgba(95, 230, 207, .2) calc(var(--fill, 0) * 100%), transparent 0); }
.control .buy.ready { background-image: linear-gradient(rgba(95, 230, 207, .38), rgba(95, 230, 207, .38));
  border-color: var(--oiii); }
.control .buy:disabled { cursor: default; }
/* The heavy-element shop on the survey screen keeps the full-button layout. */
.upgrade { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; width: 100%; text-align: left;
  background: var(--raise); border: 1px solid var(--line); padding: 8px 10px; }
.upgrade b { font-weight: 600; }
.upgrade small { color: var(--ink); font-size: 12.5px; grid-column: 1; }
.upgrade .cost { grid-column: 2; grid-row: 1 / span 2; align-self: center; text-align: right; font: 12px var(--data); }
.upgrade:disabled { cursor: default; }
.primary { background: var(--oiii); color: #081b1a; border: 0; padding: 12px 14px; font-weight: 700; width: 100%; }
.primary:disabled { opacity: .5; cursor: default; }
.ghost { background: none; border: 1px solid var(--line); color: var(--ink); padding: 8px 10px; width: 100%; }
#log { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--quiet); }
#log div:first-child { color: var(--ink); }
.foot { margin-top: auto; gap: 10px !important; }
.speed { display: flex; align-items: center; gap: 6px; font: 12px var(--data); color: var(--quiet); }
.speed button { background: none; border: 1px solid var(--line); padding: 3px 8px; font: 12px var(--data); min-height: 28px; min-width: 36px; }
.speed button[aria-pressed="true"] { background: var(--raise); border-color: var(--oiii); color: var(--oiii); }
.speed .reset { margin-left: auto; color: var(--quiet); }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 14px; }
.field output { font: 12px var(--data); color: var(--quiet); text-align: right; }
/* Diverging track: the centre is the starting region and costs nothing. Cost grows toward either end. */
.field input[type="range"] { grid-column: 1 / -1; width: 100%; height: 32px; margin: 0; -webkit-appearance: none; appearance: none; background:
  linear-gradient(var(--ink), var(--ink)) center / 2px 20px no-repeat,
  linear-gradient(90deg, #6aa7ff, var(--line) 50%, #ff7a5c) center / 100% 8px no-repeat; }
.field input[type="range"]::-webkit-slider-runnable-track { background: transparent; height: 32px; }
.field input[type="range"]::-moz-range-track { background: transparent; height: 32px; }
.field input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 22px; background: var(--oiii); border: 2px solid var(--void); border-radius: 3px; }
.field input[type="range"]::-moz-range-thumb { width: 10px; height: 18px; background: var(--oiii); border: 2px solid var(--void); border-radius: 3px; }
.field .scale { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; font: 11.5px var(--data); color: var(--quiet); }
.field .scale span:last-child { text-align: right; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { accent-color: var(--oiii); }
.tag { color: var(--sii); }
@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 44%) minmax(0, 1fr); }
  #panel { --pad: 14px; border-left: 0; border-top: 1px solid var(--line); padding-block: 14px; }
  #hint { left: auto; right: max(16px, env(safe-area-inset-right, 0px)); transform: none; }
  .runs .run-chip, .speed button { min-height: 44px; min-width: 44px; }
  .ghost, .primary, .upgrade { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.goal { color: var(--sii); font-size: 14px; }
.fine { font-size: 13px; }
.hint { color: var(--ink); border-left: 2px solid var(--oiii); padding-left: 10px; font-size: 14px; }
#hints { display: flex; flex-direction: column; gap: 6px; }
#hints:empty { display: none; }
.nudge { border-color: var(--oiii); color: var(--oiii); }
.bands { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
.band { display: flex; flex-direction: column; gap: 1px; background: var(--raise); padding: 6px; font: 11px var(--data); color: var(--quiet); min-width: 0; }
.band b { color: var(--ink); font: 600 12.5px var(--display); }
.band.now { outline: 2px solid var(--oiii); outline-offset: -2px; }
.field small { grid-column: 1 / -1; color: var(--quiet); font-size: 12.5px; }
.plot { width: 100%; height: auto; display: block; }
.plot text { fill: var(--quiet); font: 11px var(--data); }
.plot .tick { stroke: var(--line); stroke-width: 1; }
.plot circle { cursor: pointer; }
.plot circle:focus-visible { outline: 2px solid var(--oiii); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px var(--data); color: var(--quiet); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.runs { display: flex; flex-wrap: wrap; gap: 4px; }
.run-chip { min-width: 34px; min-height: 32px; padding: 4px 6px; background: none; border: 1px solid var(--line); font: 12px var(--data); }
.run-chip[aria-pressed="true"] { border-color: var(--oiii); color: var(--oiii); }
.countdown { flex-direction: row !important; align-items: baseline; flex-wrap: wrap; gap: 4px 12px !important; }
.countdown b { font: 600 34px var(--data); color: var(--oiii); font-variant-numeric: tabular-nums; line-height: 1; }
.countdown span { flex: 1 1 160px; font-size: 13px; color: var(--quiet); }
.reading { display: flex; flex-direction: column; gap: 10px; }
.reading article { display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--line); padding-left: 10px; }
.reading article b { font-weight: 600; font-size: 14px; }
.reading article p { font-size: 13.5px; }
.reading article.new { border-left-color: var(--oiii); }
.reading article.new p { color: var(--ink); }
.earlier summary { cursor: pointer; font: 12px var(--data); color: var(--quiet); padding: 4px 0; }
.earlier details > :not(summary) { margin-top: 8px; }
.earlier details[open] summary { margin-bottom: 4px; }
.earlier div { font-size: 13.5px; color: var(--quiet); }
.earlier:empty { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cta { position: sticky; bottom: calc(var(--pad) * -1); z-index: 1; background: var(--panel); padding-top: 6px; padding-bottom: calc(var(--pad) + 6px); margin-bottom: calc(var(--pad) * -1); }
.ghost.skip { border-color: var(--sii); color: var(--sii); margin-top: 8px; }
.banner { border-left: 2px solid var(--sii); padding-left: 10px; }
.banner p { color: var(--ink); }
.plot .mark { fill: var(--ink); font-size: 10px; pointer-events: none; }
.run-chip small { margin-left: 4px; font-size: 10px; color: var(--quiet); }
.legend i.dash { background: none; border: 1px dashed var(--quiet); }
.ghost.skip.armed { background: var(--sii); color: #1b1000; font-weight: 700; }
.plot { overflow: visible; }
</style>
<div id="app">
  <div id="stage">
    <canvas id="sky" tabindex="0" role="button" aria-label="Telescope view. Tap to gather gas."></canvas>
    <div class="hud" id="brand"><h1>ACCRETION</h1><div id="track"></div></div>
    <div class="hud" id="scale"><i></i><span id="scale-label"></span></div>
    <div class="hud" id="hint">Tap the sky to gather</div>
  </div>
  <aside id="panel" aria-live="off"></aside>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<script>
// Browser port of src/accretion. tests/test_parity.py keeps the two in step.
const Engine = (() => {
  const G = 6.674e-8, K_B = 1.381e-16, M_H = 1.673e-24, MSUN = 1.989e33, AU = 1.496e13;
  const YR = 3.156e7, MU = 1.22, ZSUN = 0.0134, PRIMORDIAL_METAL_LOG10 = -4, ALPHA_B = 2.6e-13, HII_SOUND_SPEED = 1.0e6;
  const G_AU = 4 * Math.PI ** 2, CELLS = 16, R_IN = 1.0, R_OUT = 3000.0, CS2_1AU = 0.5;
  const FRAGMENT_LIMIT = 4, FRAGMENT_ACCRETION_PER_ORBIT = 0.3, FRAGMENT_ACCRETION_MAX_SHARE = 0.5, FRAGMENT_MIGRATION_FACTOR = 1.0;
  const TWO_PI = 2 * Math.PI, GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
  const SIM_STEP_YEARS = 50.0, ACCRETE_YEARS_PER_SECOND = 700.0, COLLAPSE_SECONDS = 20.0;
  const MS_REFERENCE_SECONDS = 240.0, MS_REFERENCE_MYR = 5.0, MS_EXPONENT = 1.12;
  const SKIP_THRESHOLD_SECONDS = 3600.0, SEED_MASS = 0.01, BASE_TEMPERATURE = 250.0, ENRICHED_TEMPERATURE_MARGIN = 1.3, ENRICHED_ENVIRONMENT = 15.0;
  const BASE_DENSITY = 1.0e4, SIGMA_LN_DENSITY = 1.5;
  const SIGMA_LN_TEMPERATURE_PRIMORDIAL = 0.15, SIGMA_LN_TEMPERATURE_ENRICHED = 0.35, SIGMA_LOG10_METAL = 1.0, BASE_REACH_RATE = 0.05;
  const BASE_TAP = 0.08, BASE_ALPHA = 0.1, ACCRETION_LIMIT_YEARS = 1.5e6, COSMIC_START_GYR = 0.12;
  const FAILED_RUN_FACTOR = 1.1, BLACK_HOLE_START_COST = 1.0, BLACK_HOLE_INFALL_FACTOR = 1.5;
  const LOCAL_GAS_MASS = 1.0e6, ROTATION_MIN_MASS = 15.0;

  const LIFE_MASS = [0.1, 0.3, 0.5, 0.8, 1, 2, 3, 5, 8, 10, 15, 20, 25, 40, 60, 85, 120, 150, 200, 300];
  const LIFE_METAL = [-4, -1.54, -0.85, 0];
  const LIFE_MYR = [
    [3.3e6, 3.1e5, 5.1e4, 13749, 6108, 634.5, 209.3, 67.29, 26.95, 18.92, 11.31, 8.47, 6.94, 4.83, 3.75, 3.17, 2.74, 2.51, 2.27, 2.05],
    [3.3e6, 3.1e5, 5.1e4, 11130, 4912, 582.6, 215.8, 72.99, 30.7, 20.7, 10.95, 7.90, 6.48, 4.47, 3.51, 2.98, 2.61, 2.51, 2.29, 2.10],
    [4.8e6, 3.8e5, 6e4, 11575, 5492, 667.0, 240.3, 77.36, 31.45, 21.03, 11.00, 7.89, 6.45, 4.51, 3.56, 3.02, 2.65, 2.51, 2.29, 2.10],
    [6e6, 5.6e5, 1e5, 2.1e4, 9400, 1008.8, 320.6, 88.19, 32.62, 21.56, 11.02, 7.74, 6.31, 4.44, 3.53, 3.02, 2.67, 2.50, 2.32, 2.15],
  ];
  const LUM_MASS = [0.1, 0.5, 1, 2, 5, 10, 25, 40, 60, 120, 200, 300];
  const LUM_METAL = [-2.5, 0];
  const LUM_LOG10 = [
    [-2.80, -1.11, 0.25, 1.48, 2.90, 3.80, 4.86, 5.35, 5.71, 6.24, 6.57, 6.84],
    [-3.07, -1.43, -0.14, 1.23, 2.73, 3.75, 4.87, 5.35, 5.71, 6.24, 6.57, 6.81],
  ];
  const ION_MASS = [5, 9, 15, 25, 40, 60, 80, 120, 200, 300, 500];
  const ION_RATE = [1.1e45, 1.8e47, 1.4e48, 5.5e48, 1.9e49, 3.5e49, 5.9e49, 1.1e50, 2.3e50, 4.0e50, 7.4e50];
  const SN_MIN_METAL = [-5, -4, -2, -1, 0], SN_MIN_MASS = [9.2, 8.6, 8.4, 8.6, 9.4];
  const AGE_GYR = [0.18, 0.37, 0.47, 0.64, 0.92, 1.53, 2.13, 3.26, 5.82, 13.73];
  const AGE_REDSHIFT = [20, 12, 10, 8, 6, 4, 3, 2, 1, 0];
  const WD_MASS = [1, 2.5, 3, 6], WD_METALS_LOW = [0.0003, 0.057, 0.026, 0.038], WD_METALS_SOLAR = [0.008, 0.041, 0.062, 0.116];
  const BH_MASS = [30, 60, 120], BH_METALS_SOLAR = [0.26, 0.97, 3.4], BH_METALS_LOW = 0.005, PAIR_METAL_FRACTION = 0.45;
  const EXPLOSION_ISLANDS = [[0, 18.5], [20, 21.2], [25, 27]];
  function interpolate(xs, ys, x) {
    if (x <= xs[0]) return ys[0];
    for (let i = 1; i < xs.length; i++) {
      if (x <= xs[i]) return ys[i - 1] + (x - xs[i - 1]) / (xs[i] - xs[i - 1]) * (ys[i] - ys[i - 1]);
    }
    return ys[ys.length - 1];
  }
  const logTable = (masses, rows, metals, mass, metal) => interpolate(metals, rows.map((row) => interpolate(masses.map(Math.log10), row, Math.log10(mass))), metal);
  const LIFE_LOG10 = LIFE_MYR.map((row) => row.map(Math.log10));

  const UPGRADES = {
    reach: { phase: "gather", base: 1.0e-50, ratio: 1.0e10, max: 30 },
    tap: { phase: "gather", base: 1.0e-49, ratio: 1.0e9, max: 30 },
    cooling: { phase: "gather", base: 1.0e-47, ratio: 1.0e8, max: 15 },
    turbulence: { phase: "accrete", base: 1.0e47, ratio: 2.2, max: 11 },
    braking: { phase: "accrete", base: 2.0e47, ratio: 2.5, max: 8 },
  };

  const ratio = (R_OUT / R_IN) ** (1 / CELLS);
  const EDGES = Array.from({ length: CELLS + 1 }, (_, i) => R_IN * ratio ** i);
  const RADII = Array.from({ length: CELLS }, (_, i) => Math.sqrt(EDGES[i] * EDGES[i + 1]));
  const AREAS = Array.from({ length: CELLS }, (_, i) => Math.PI * (EDGES[i + 1] ** 2 - EDGES[i] ** 2));

  const soundSpeed = (t) => Math.sqrt(K_B * t / (MU * M_H));
  const massDensity = (n) => MU * M_H * n;
  const jeansMass = (t, n) => (5 * K_B * t / (G * MU * M_H)) ** 1.5 * (3 / (4 * Math.PI * massDensity(n))) ** 0.5 / MSUN;
  const freeFallTime = (n) => Math.sqrt(3 * Math.PI / (32 * G * massDensity(n)));
  const infallRate = (t) => soundSpeed(t) ** 3 / G * YR / MSUN;
  const breakMass = (rate) => 20 * (rate / 1.6e-3) ** (2 / 3);
  const luminosity = (m, z) => 10 ** logTable(LUM_MASS, LUM_LOG10, LUM_METAL, m, z);
  const lifetimeMyr = (m, z) => 10 ** logTable(LIFE_MASS, LIFE_LOG10, LIFE_METAL, m, z);
  const rotationBonus = (m, z) => Math.min(z >= -0.5 ? 0.25 : z >= -2 ? 0.18 : 0.10, interpolate([120, 200, 300], [0.25, 0.14, 0.10], m));
  const ionizingRate = (m) => 10 ** interpolate(ION_MASS.map(Math.log10), ION_RATE.map(Math.log10), Math.log10(m));
  const stromgrenRadius = (q, n) => (3 * q / (4 * Math.PI * n ** 2 * ALPHA_B)) ** (1 / 3);
  const hiiRadius = (q, n, temp, s) => {
    const r0 = stromgrenRadius(q, n);
    return Math.min(r0 * (1 + 7 * HII_SOUND_SPEED * s / (4 * r0)) ** (4 / 7), r0 * (HII_SOUND_SPEED / soundSpeed(temp)) ** (4 / 3));
  };
  const diskLossRate = (m, r) => 5 * 5.4e-5 * Math.sqrt(ionizingRate(m) / 1e49) * Math.sqrt(r / 1000);
  const coolingTemperature = (z) => Math.max(10, 200 * 10 ** (-0.47 * Math.max(0, z - Math.log10(1.3e-4))));
  function redshift(age) {
    const x = Math.log10(age), logs = AGE_GYR.map(Math.log10);
    if (x < logs[0]) return 21 * (AGE_GYR[0] / age) ** (2 / 3) - 1;
    return 10 ** interpolate(logs, AGE_REDSHIFT.map((z) => Math.log10(1 + z)), x) - 1;
  }
  const temperatureFloor = (z, age) => Math.max(2.725 * (1 + redshift(age)), coolingTemperature(z));
  const cosmicFit = (age) => { const x = age / 3.82; return Math.log10(0.108 * x ** 3.42 / (1 + x ** 3.20)); };
  const cosmicMetal = (age) => age >= 0.2 ? cosmicFit(age) : interpolate([0.12, 0.2], [-8, cosmicFit(0.2)], age);
  const hydrogenLimit = (z) => z >= -0.5 ? 0.075 : z >= -4 ? 0.083 : 0.09;
  const explodes = (m) => EXPLOSION_ISLANDS.some(([low, high]) => low <= m && m < high);
  function ending(m, z) {
    if (m < hydrogenLimit(z)) return "brown_dwarf";
    if (m < interpolate(SN_MIN_METAL, SN_MIN_MASS, z)) return "white_dwarf";
    if (m >= 140 && m < 260 && z < -0.5) return "pair_instability";
    if (z < PRIMORDIAL_METAL_LOG10) return m < 25 ? "supernova" : "black_hole";
    return explodes(m) ? "supernova" : "black_hole";
  }
  function heavyYield(m, kind, z) {
    if (kind === "white_dwarf") {
      const share = Math.min(1, Math.max(0, (z + 4) / 4)), low = interpolate(WD_MASS, WD_METALS_LOW, m), high = interpolate(WD_MASS, WD_METALS_SOLAR, m);
      return low + share * (high - low);
    }
    if (kind === "supernova") return Math.max(0.2, 0.36 * (m - 11));
    if (kind === "black_hole") {
      const share = Math.min(1, Math.max(0, (z + 3) / 3));
      return BH_METALS_LOW + share * (interpolate(BH_MASS, BH_METALS_SOLAR, m) - BH_METALS_LOW);
    }
    return kind === "pair_instability" ? PAIR_METAL_FRACTION * m : 0;
  }

  const KELVIN_TO_CS2 = CS2_1AU / 1660;

const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
function sci(x, d = 1) {
  if (x === 0) return "0";
  const a = Math.abs(x);
  if (a >= 0.01 && a < 10000) return x.toLocaleString("en-US", { maximumFractionDigits: a < 10 ? 2 : a < 100 ? 1 : 0 });
  const e = Math.floor(Math.log10(a)), m = x / 10 ** e;
  return `${m.toFixed(d)}×10${String(e).split("").map((c) => SUP[c]).join("")}`;
}
function length(cm) {
  if (cm < 100) return `${sci(cm)} cm`;
  if (cm < 1e5) return `${sci(cm / 100)} m`;
  if (cm < 1.5e12) return `${sci(cm / 1e5)} km`;
  if (cm < 9.46e16) return `${sci(cm / 1.496e13)} AU`;
  return `${sci(cm / 9.46e17)} ly`;
}
function mass(msun) {
  const grams = msun * 1.989e33;
  if (grams < 1e-15) return `${sci(Math.round(grams / 2.04e-24), 1)} atoms`;
  if (grams < 1e27) return `${sci(grams)} g`;
  return `${sci(msun)} M☉`;
}
function duration(seconds) {

  if (seconds < 172800) return `${(seconds / 3600).toFixed(1)} h`;
  return `${(seconds / 86400).toFixed(0)} days`;
}

function lifeVsSun(forecastMyr) {
  const gyr = forecastMyr >= 1000;
  return `about ${sci(gyr ? forecastMyr / 1000 : forecastMyr)} ${gyr ? "Gyr" : "Myr"}, where the Sun lasts about ${gyr ? "10" : "10,000"} ${gyr ? "Gyr" : "Myr"}`;
}
function clock(seconds) {
  const s = Math.max(0, Math.ceil(seconds)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, pad = (x) => String(x).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
}

// Player-facing text lives in content/*.toml. The build validates the files and
// embeds them as TEXT; t() looks a key up and fills named placeholders with
// finished strings. A missing key or placeholder degrades instead of throwing.
function t(key, values = {}) {
  const raw = typeof TEXT?.[key] === "string" ? TEXT[key] : null;
  if (raw == null) { console.warn(`Text key not found: ${key}`); return `[missing: ${key}]`; }
  return raw.replace(/\{([a-z][a-z0-9_]*)\}/g, (whole, name) => {
    const value = Object.prototype.hasOwnProperty.call(values, name) ? values[name] : undefined;
    if (value != null) return String(value);
    console.warn(`Placeholder {${name}} not supplied for key: ${key}`);
    return `[missing: ${key}.${name}]`;
  });
}

// Shine phase. The HII region is display only: Stromgren sphere, Spitzer expansion, then stall.
const IONIZING_MIN_MASS = 5;
function bubble(run, meta) {
  if (run.phase !== "main_sequence" || run.starMass < IONIZING_MIN_MASS) return null;
  const q = E.ionizingRate(run.starMass), n = run.density, T = E.temperature(run, meta);

  const ratio = E.HII_SOUND_SPEED / E.soundSpeed(T);
  const stallAt = 4 * start / (7 * E.HII_SOUND_SPEED) * (ratio ** (7 / 3) - 1);
  const grow = end > start * 1.001 ? Math.log(now / start) / Math.log(end / start) : 1;
  return { start, now, end, grow, stalled: age >= stallAt, stallShare: Math.min(1, stallAt / lifeSeconds) };
}
function burned(run) { return run.msDuration ? Math.min(1, run.msElapsed / run.msDuration) : 0; }
function shineNotes(run, meta) {

  // "How it fuses" joins one fusion route and one later-fate entry, as it did before the move.
  const route = m < 1.3 ? t("notes.shine.fusion_route.pp")
    : run.metalLog10 < E.PRIMORDIAL_METAL_LOG10 ? t("notes.shine.fusion_route.cno_pristine")
      : t("notes.shine.fusion_route.cno_enriched");
  const future = m < 0.5 ? t("notes.shine.fusion_future.never_helium")
    : m < 9 ? t("notes.shine.fusion_future.stops_at_carbon")
      : t("notes.shine.fusion_future.ends_in_iron");
  const notes = [
    [0, t("notes.shine.main_sequence.title"), t("notes.shine.main_sequence.body")],
    [0.08, t("notes.shine.fast_time.title"), t("notes.shine.fast_time.body", { years_per_second: sci(years), history_seconds: sci(5000 / years) })],
    [0.2, t("notes.shine.brightness.title"), heavy
      ? t("notes.shine.brightness_heavy.body", { brightness: sci(L), life_vs_sun: lifeVsSun(run.forecastMyr) })
      : t("notes.shine.brightness_small.body", { brightness: sci(L), life_vs_sun: lifeVsSun(run.forecastMyr) })],
    [0.35, t("notes.shine.how_it_fuses.title"), `${route} ${future}`],
    [0.5, t("notes.shine.starlight.title"), b
      ? t("notes.shine.starlight_bubble.body", { edge_distance: length(b.now) })
      : t("notes.shine.starlight_cool.body")],
    [0.7, t("notes.shine.helium_ash.title"), t("notes.shine.helium_ash.body")],
    [0.9, t("notes.shine.running_low.title"), t("notes.shine.running_low.body")],

  if (b) notes.push([Math.max(0.12, b.stallShare), t("notes.shine.bubble_stalls.title"), t("notes.shine.bubble_stalls.body", { edge_distance: length(b.end) })]);

}
