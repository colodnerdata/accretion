<style>
/* Layout: a live telescope view with an instrument panel beside it, stacked on phones.
   A single dark look, using narrowband emission-line colors. */
:root {
  --void: #0c0a1c; --panel: #151230; --raise: #201c43; --line: #3a3468;
  --ink: #f1edff; --quiet: #b1a9d6; --dwarf: #c9785f;

  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font: 15px/1.45 var(--display); overflow: hidden; }
#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
#stage { position: relative; min-width: 0; min-height: 0; touch-action: manipulation; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
#sky:focus-visible { outline: 2px solid var(--oiii); outline-offset: -4px; }
.hud { position: absolute; pointer-events: none; text-shadow: 0 0 6px var(--void), 0 0 2px var(--void); }
#brand { top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); }
#brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .24em; }
#track { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font: 11.5px var(--data); color: var(--quiet); }
#track .now { color: var(--halpha); }
#track .done { color: var(--ink); }
#scale { bottom: 14px; left: max(16px, env(safe-area-inset-left, 0px)); font: 12px var(--data); color: var(--ink); }
#scale i { display: block; width: 96px; height: 2px; margin-bottom: 5px; background: var(--ink); }
#hint { left: 50%; bottom: 14px; transform: translateX(-50%); font: 12px var(--data); color: var(--oiii); white-space: nowrap; }
#panel { --pad: 18px; min-width: 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
  background: var(--panel); border-left: 1px solid var(--line); padding-block: 18px;

#panel section { display: flex; flex-direction: column; gap: 8px; }
h2 { margin: 0; font-size: 22px; line-height: 1.15; font-weight: 700; text-wrap: balance; }

p { margin: 0; color: var(--quiet); }

.stats dt { color: var(--quiet); }
.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

.setup-group { display: flex; flex-direction: column; gap: 3px; }

/* One row per control in the play panel: name and level outside the button,

  background: var(--raise); border: 1px solid var(--line); padding: 8px 10px; }

.control .u-head b { font-weight: 600; }
.control.ready .u-head b { color: var(--oiii); }

.control .buy { grid-column: 2; grid-row: 1 / span 2; align-self: center; justify-self: end; min-width: 9em;
  text-align: right; font: 12px var(--data); padding: 6px 10px; background: var(--raise); border: 1px solid var(--line);
  background-image: linear-gradient(90deg, rgba(95, 230, 207, .2) calc(var(--fill, 0) * 100%), transparent 0); }
.control .buy.ready { background-image: linear-gradient(rgba(95, 230, 207, .38), rgba(95, 230, 207, .38));
  border-color: var(--oiii); }
.control .buy:disabled { cursor: default; }
/* The heavy-element shop on the survey screen keeps the full-button layout. */

  background: var(--raise); border: 1px solid var(--line); padding: 8px 10px; }
.upgrade b { font-weight: 600; }
.upgrade small { color: var(--ink); font-size: 12.5px; grid-column: 1; }

.primary:disabled { opacity: .5; cursor: default; }

#log { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--quiet); }
#log div:first-child { color: var(--ink); }
.foot { margin-top: auto; gap: 10px !important; }
.speed { display: flex; align-items: center; gap: 6px; font: 12px var(--data); color: var(--quiet); }
.speed button { background: none; border: 1px solid var(--line); padding: 3px 8px; font: 12px var(--data); min-height: 28px; min-width: 36px; }
.speed button[aria-pressed="true"] { background: var(--raise); border-color: var(--oiii); color: var(--oiii); }
.speed .reset { margin-left: auto; color: var(--quiet); }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 14px; }
.field output { font: 12px var(--data); color: var(--quiet); text-align: right; }
/* Diverging track: the centre is the starting region and costs nothing. Cost grows toward either end. */
.field input[type="range"] { grid-column: 1 / -1; width: 100%; height: 32px; margin: 0; -webkit-appearance: none; appearance: none; background:
  linear-gradient(var(--ink), var(--ink)) center / 2px 20px no-repeat,
  linear-gradient(90deg, #6aa7ff, var(--line) 50%, #ff7a5c) center / 100% 8px no-repeat; }
.field input[type="range"]::-webkit-slider-runnable-track { background: transparent; height: 32px; }
.field input[type="range"]::-moz-range-track { background: transparent; height: 32px; }
.field input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 22px; background: var(--oiii); border: 2px solid var(--void); border-radius: 3px; }
.field input[type="range"]::-moz-range-thumb { width: 10px; height: 18px; background: var(--oiii); border: 2px solid var(--void); border-radius: 3px; }
.field .scale { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; font: 11.5px var(--data); color: var(--quiet); }
.field .scale span:last-child { text-align: right; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { accent-color: var(--oiii); }
.tag { color: var(--sii); }
@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 44%) minmax(0, 1fr); }
  #panel { --pad: 14px; border-left: 0; border-top: 1px solid var(--line); padding-block: 14px; }
  #hint { left: auto; right: max(16px, env(safe-area-inset-right, 0px)); transform: none; }
  .runs .run-chip, .speed button { min-height: 44px; min-width: 44px; }
  .ghost, .primary, .upgrade { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.goal { color: var(--sii); font-size: 14px; }
.fine { font-size: 13px; }
.hint { color: var(--ink); border-left: 2px solid var(--oiii); padding-left: 10px; font-size: 14px; }
#hints { display: flex; flex-direction: column; gap: 6px; }
#hints:empty { display: none; }
.nudge { border-color: var(--oiii); color: var(--oiii); }
.bands { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
.band { display: flex; flex-direction: column; gap: 1px; background: var(--raise); padding: 6px; font: 11px var(--data); color: var(--quiet); min-width: 0; }
.band b { color: var(--ink); font: 600 12.5px var(--display); }
.band.now { outline: 2px solid var(--oiii); outline-offset: -2px; }
.field small { grid-column: 1 / -1; color: var(--quiet); font-size: 12.5px; }
.plot { width: 100%; height: auto; display: block; }
.plot text { fill: var(--quiet); font: 11px var(--data); }
.plot .tick { stroke: var(--line); stroke-width: 1; }
.plot circle { cursor: pointer; }
.plot circle:focus-visible { outline: 2px solid var(--oiii); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px var(--data); color: var(--quiet); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.runs { display: flex; flex-wrap: wrap; gap: 4px; }
.run-chip { min-width: 34px; min-height: 32px; padding: 4px 6px; background: none; border: 1px solid var(--line); font: 12px var(--data); }
.run-chip[aria-pressed="true"] { border-color: var(--oiii); color: var(--oiii); }
.countdown { flex-direction: row !important; align-items: baseline; flex-wrap: wrap; gap: 4px 12px !important; }
.countdown b { font: 600 34px var(--data); color: var(--oiii); font-variant-numeric: tabular-nums; line-height: 1; }
.countdown span { flex: 1 1 160px; font-size: 13px; color: var(--quiet); }
.reading { display: flex; flex-direction: column; gap: 10px; }
.reading article { display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--line); padding-left: 10px; }
.reading article b { font-weight: 600; font-size: 14px; }
.reading article p { font-size: 13.5px; }
.reading article.new { border-left-color: var(--oiii); }
.reading article.new p { color: var(--ink); }
.earlier summary { cursor: pointer; font: 12px var(--data); color: var(--quiet); padding: 4px 0; }
.earlier details > :not(summary) { margin-top: 8px; }
.earlier details[open] summary { margin-bottom: 4px; }
.earlier div { font-size: 13.5px; color: var(--quiet); }
.earlier:empty { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cta { position: sticky; bottom: calc(var(--pad) * -1); z-index: 1; background: var(--panel); padding-top: 6px; padding-bottom: calc(var(--pad) + 6px); margin-bottom: calc(var(--pad) * -1); }
.ghost.skip { border-color: var(--sii); color: var(--sii); margin-top: 8px; }
.banner { border-left: 2px solid var(--sii); padding-left: 10px; }
.banner p { color: var(--ink); }
.plot .mark { fill: var(--ink); font-size: 10px; pointer-events: none; }
.run-chip small { margin-left: 4px; font-size: 10px; color: var(--quiet); }
.legend i.dash { background: none; border: 1px dashed var(--quiet); }
.ghost.skip.armed { background: var(--sii); color: #1b1000; font-weight: 700; }
.plot { overflow: visible; }
</style>
<div id="app">
  <div id="stage">
    <canvas id="sky" tabindex="0" role="button" aria-label="Telescope view. Tap to gather gas."></canvas>
    <div class="hud" id="brand"><h1>ACCRETION</h1><div id="track"></div></div>
    <div class="hud" id="scale"><i></i><span id="scale-label"></span></div>
    <div class="hud" id="hint">Tap the sky to gather</div>
  </div>
  <aside id="panel" aria-live="off"></aside>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<script>
// Pure display mappings shared by the survey, gather, collapse, and accrete scenes
// and the setup strip.
//
// CONCEPT NOTE
//
// Temperature as speed. A gas particle's typical (rms) speed is
// v ~ sqrt(3 k T / m), so only ratios matter and only the true ratios are
// shown. A temperature ratio R becomes a speed ratio sqrt(R): twice as hot
// is 1.41x faster, 10 K to 1000 K is 10x faster. A particle of mass ratio M
// (over hydrogen) moves 1/sqrt(M) as fast: helium (4 amu) half hydrogen's
// speed, a representative metal (16 amu, oxygen) a quarter. The screens
// draw speed as px/s through one shared constant, SPEED_BASE_PX: hydrogen
// at 10 K moves at that base and every other case carries the true ratio;
// across the modeled 10-1000 K range that tops out at 10x the base, so the
// harder cap at SPEED_CAP_PX is only a safety for out-of-range settings.
// Speed is the only channel that encodes temperature; color never does.
//
// Composition as color. One color each for hydrogen, helium, and metals,
// with a visible key on the canvas. Helium is 8% of atoms in every gas,
// pristine included. The true metal share by number is
// share = 10^(log10 Z - 3): 1 in 1000 atoms at solar metallicity, 1 in
// 100,000 at 1/100 solar - far below one drawn particle, so the DISPLAYED
// metal share is amplified: linear in log10 Z from zero at the engine's
// primordial threshold to a cap (0.28 of particles) at solar metallicity.
// The canvas shows "metals shown far more common than in reality" whenever
// any metal particle is drawn. Pristine gas draws only hydrogen and helium.
//
// Density as zoom. The drawn particle count stays fixed; equal mass
// occupies equal volume, so linear size scales as density^(-1/3). The drawn
// scale (scale bar and gas spread) multiplies by (1e4 / density)^(1/3):
// two decades of density shift the scale 4.64x either way, matching the
// survey's 10^2 .. 10^6 /cm3 range. The zoom animates smoothly when the
// density slider moves; with reduced motion it jumps straight to the new
// scale. No count adjustment on top: the bar carries the whole change.
//
// Black hole nearby. When "start near a black hole" is checked, the
// existing grid warp is drawn centred off-screen in one direction, with a
// label that names it a map of gravity's pull.
//
// Disk stability as color. Toomre Q = c_s * Omega / (pi * G * Sigma) says
// whether a ring of gas holds together against its own gravity: Q >= 1 means
// pressure and shear win (stable), Q < 1 means the ring clumps. The engine
// already computes Q per ring. One log scale colors every ring:
// shade = clamp(1 - log10(Q) / log10(Q_CALM), 0, 1), so Q >= 10 is fully calm
// (shade 0), Q = 1 is fully unstable (shade 1), and each decade of Q moves the
// color by the same amount. Calm is cool blue-violet, the midpoint amber, the
// unstable end rose; unstable rings also draw a wider glow, so the cue is not
// hue alone. Ring brightness stays with gas mass, a separate channel.
//
// Fragments as clumps. A clump's drawn radius grows with the logarithm of its
// mass: the reference mass is one Jupiter (0.001 solar masses) at a base size,
// and each tenfold in mass adds a fixed step, between a floor and a cap that
// keeps even a large clump smaller than the star's own disc. Every size is a
// share of the scene radius R, so a phone and a desktop agree.
//
// Clump motion. A clump moves on its orbit at the Keplerian rate; where that
// is too fast to follow on screen (close to the star) the drawn rate is capped
// so it reads as steady circling, not flicker.
//
// Turbulence as jitter. Turbulence is the disk's effective viscosity, nu =
// alpha * c_s^2 / Omega, and sets how fast gas drifts inward (v_r ~ alpha). The
// drawn drift speed carries alpha linearly; the sideways jitter of each gas
// dot's path has an amplitude that grows as alpha^1.2, a little faster than the
// drift itself, so each purchased level (alpha x 1.3) is a 37% larger wobble:
// a small wobble at the base alpha of 0.1, a wide scatter near 1.
//
// The setup strip lists the region, heavy-element and control choices behind
// the run. Which of them matter depends on the phase; that map is data here.

const METAL_DISPLAY_CAP = 0.28;
const HELIUM_SHARE = 0.08;
const DENSITY_REFERENCE = 1e4;
const SPEED_BASE_PX = 7;
const SPEED_CAP_PX = 110;
const HYDROGEN_MASS = 1;
const HELIUM_MASS = 4;
const METAL_MASS = 16;
// Colors: hydrogen warm pink, helium teal, metals violet, all on the
// engine's existing palette so the scenes stay one system.
const SPECIES_COLORS = { hydrogen: "#ff5f7e", helium: "#5fe6cf", metals: "#9d8cff" };

// Relative speed of hydrogen against 10 K, from the sqrt(T/m) law.
const speedForTemperature = (kelvin, reference = 10) => Math.sqrt(kelvin / reference);

// Relative speed against hydrogen for a mass ratio.
const speedForMass = (massRatio) => 1 / Math.sqrt(massRatio);

// True share of atoms that are metals at log10 Z: 1/1000 at solar.
const metalShare = (log10z) => 10 ** (log10z - 3);

// Displayed metal share: linear in log10 Z from the primordial threshold to
// solar metallicity, capped at METAL_DISPLAY_CAP. Pristine gas shows none.
const metalDisplayShare = (log10z, primordialLimit) => {
  if (log10z < primordialLimit) return 0;
  return METAL_DISPLAY_CAP * Math.min(1, Math.max(0, (log10z - primordialLimit) / -primordialLimit));
};

// Fractions of drawn particles by species, for one gas composition.
const speciesMix = (log10z, primordialLimit) => {
  const metals = metalDisplayShare(log10z, primordialLimit);
  return { hydrogen: 1 - HELIUM_SHARE - metals, helium: HELIUM_SHARE, metals };
};

// Drawn scale ratio for a number density: cube root of the volume ratio.
const zoomScale = (density, reference = DENSITY_REFERENCE) => (reference / density) ** (1 / 3);

// Disk stability (Toomre Q) scale: fully calm at Q_CALM, fully unstable at 1.
const Q_CALM = 10;
const Q_UNSTABLE = 1;
// Calm, midpoint, unstable ring colors (RGB), and the neutral for empty rings.
const STABILITY_STOPS = [[111, 134, 255], [255, 184, 107], [255, 95, 126]];
const EMPTY_RING_RGB = [207, 200, 255];

// Shade in [0, 1] for a Toomre Q: 0 calm, 1 at or below Q = 1.
const stabilityShade = (q) => {
  if (!(q > 0)) return 1;
  if (!Number.isFinite(q)) return 0;
  return Math.min(1, Math.max(0, 1 - Math.log10(q) / Math.log10(Q_CALM)));
};

// Ring styling for a Toomre Q: color, shade, and a glow weight that is 0 when
// calm and 1 at Q = 1. An empty ring (infinite Q) gets the neutral color.
const stabilityColor = (q) => {
  if (!Number.isFinite(q) && q > 0) return { color: `rgb(${EMPTY_RING_RGB.join(",")})`, shade: 0, glow: 0, empty: true };
  const shade = stabilityShade(q), pos = shade * (STABILITY_STOPS.length - 1);
  const k = Math.min(STABILITY_STOPS.length - 2, Math.floor(pos)), f = pos - k;
  const rgb = STABILITY_STOPS[k].map((c, i) => Math.round(c + (STABILITY_STOPS[k + 1][i] - c) * f));
  return { color: `rgb(${rgb.join(",")})`, shade, glow: shade * shade, empty: false };
};

// Fragment clump radius in px, log-scaled in mass, as a share of scene radius R.
const FRAGMENT_MASS_REF = 1e-3;
const FRAGMENT_BASE_SHARE = 0.012;
const FRAGMENT_STEP_SHARE = 0.008;
const FRAGMENT_MIN_SHARE = 0.009;
const FRAGMENT_MAX_SHARE = 0.045;
const fragmentRadiusPx = (mass, R) => {
  const decades = Math.log10(Math.max(mass, 1e-12) / FRAGMENT_MASS_REF);
  const share = Math.min(FRAGMENT_MAX_SHARE, Math.max(FRAGMENT_MIN_SHARE, FRAGMENT_BASE_SHARE + FRAGMENT_STEP_SHARE * decades));
  return Math.max(2.5, share * R);
};

// Sideways jitter amplitude in px for the viscosity parameter alpha.
const JITTER_BASE_ALPHA = 0.1;
const JITTER_BASE_SHARE = 0.02;
const JITTER_MAX_SHARE = 0.12;
const JITTER_EXPONENT = 1.2;
const jitterAmplitude = (alpha, R) => {
  if (!(alpha > 0)) return 0;
  return R * Math.min(JITTER_MAX_SHARE, JITTER_BASE_SHARE * (alpha / JITTER_BASE_ALPHA) ** JITTER_EXPONENT);
};

// Drawn angular speed of a clump in rad per real second. A clump orbits at
// omega (rad per simulated year) while the game runs `yearsPerSecond` years per
// real second; close in, that would spin faster than frames can show and
// strobe, so the drawn speed is capped. Slow outer orbits stay true to scale.
const CLUMP_SPIN_CAP = 4;
const clumpAngularRate = (omegaPerYear, yearsPerSecond) => Math.min(CLUMP_SPIN_CAP, omegaPerYear * yearsPerSecond);

// Reading the fragment list between two frames. The engine keeps fragments as
// a plain list: new ones are appended at the end (while below the limit), ones
// that reach the star are filtered out in place, and at the limit a new one is
// absorbed by the nearest. `formedUp` is how many fragments formed in the
// frame. Only unambiguous frames are interpreted:
//  - nothing formed, the list shrank or stayed: the smallest-radius ones left;
//  - the list grew by exactly what formed: the extras at the end are new;
//  - at the limit, the list stayed the same and something formed: the host
//    (clearly the largest mass gain) absorbed it, and its birth radius follows
//    from conserving sqrt(r) * mass, approximately, since gas take and drift
//    in the same steps also change the host.
// Anything else (a fragment formed and another left in the same frame, a list
// that jumps) resyncs: the clumps are paired afresh with no animation, so a
// busy frame costs an animation, never a clump drawn with the wrong identity.
const CLUMP_CONTINUITY = 0.5;
const diffFragments = (prev, next, formedUp, limit, rIn = 1) => {
  const resync = { resync: true, kept: [], gone: [], appended: 0, host: -1, incoming: 0 };
  const grew = next.length - prev.length;
  const near = (a, b) => a.radius > 0 && b.radius > 0 && Math.abs(Math.log(a.radius / b.radius)) < CLUMP_CONTINUITY;
  let kept, gone = [], appended = 0, host = -1, incoming = 0;
  if (formedUp === 0 && grew <= 0) {
    const order = prev.map((b, i) => [b.radius, i]).sort((a, b) => a[0] - b[0]);
    gone = order.slice(0, -grew).map(([, i]) => i);
    kept = prev.map((_, i) => i).filter((i) => !gone.includes(i));
  } else if (formedUp > 0 && grew === formedUp) {
    kept = prev.map((_, i) => i);
    appended = grew;
  } else if (formedUp > 0 && grew === 0 && prev.length === limit && prev.length > 0) {
    kept = prev.map((_, i) => i);
    // The host is the clump whose mass grew most in absolute terms: gas take
    // grows a small clump by a larger share than an absorbed fragment grows a
    // large one, but adds less mass. A close second place, or a clump near
    // the star that may have merged in the same frame, is not readable.
    const jumps = kept.map((pi, j) => next[j].mass - prev[pi].mass);

// Player-facing text lives in content/*.toml. The build validates the files and
// embeds them as TEXT; t() looks a key up and fills named placeholders with
// finished strings. A missing key or placeholder degrades instead of throwing.
function t(key, values = {}) {
  const raw = typeof TEXT?.[key] === "string" ? TEXT[key] : null;
  if (raw == null) { console.warn(`Text key not found: ${key}`); return `[missing: ${key}]`; }
  return raw.replace(/\{([a-z][a-z0-9_]*)\}/g, (whole, name) => {
    const value = Object.prototype.hasOwnProperty.call(values, name) ? values[name] : undefined;
    if (value != null) return String(value);
    console.warn(`Placeholder {${name}} not supplied for key: ${key}`);
    return `[missing: ${key}.${name}]`;
  });
}

// Shine phase. The HII region is display only: Stromgren sphere, Spitzer expansion, then stall.
const IONIZING_MIN_MASS = 5;
function bubble(run, meta) {
  if (run.phase !== "main_sequence" || run.starMass < IONIZING_MIN_MASS) return null;

  const stallAt = 4 * start / (7 * E.HII_SOUND_SPEED) * (ratio ** (7 / 3) - 1);
  const grow = end > start * 1.001 ? Math.log(now / start) / Math.log(end / start) : 1;

}

  const m = run.starMass, b = bubble(run, meta), years = run.lifetimeMyr * 1e6 / run.msDuration;
  const L = E.luminosity(m, run.metalLog10), heavy = m >= 1;
  // "How it fuses" joins one fusion route and one later-fate entry, as it did before the move.
  const route = m < 1.3 ? t("notes.shine.fusion_route.pp")
    : run.metalLog10 < E.PRIMORDIAL_METAL_LOG10 ? t("notes.shine.fusion_route.cno_pristine")
      : t("notes.shine.fusion_route.cno_enriched");
  const future = m < 0.5 ? t("notes.shine.fusion_future.never_helium")
    : m < 9 ? t("notes.shine.fusion_future.stops_at_carbon")
      : t("notes.shine.fusion_future.ends_in_iron");
  const notes = [
    [0, t("notes.shine.main_sequence.title"), t("notes.shine.main_sequence.body")],
    [0.08, t("notes.shine.fast_time.title"), t("notes.shine.fast_time.body", { years_per_second: sci(years), history_seconds: sci(5000 / years) })],
    [0.2, t("notes.shine.brightness.title"), heavy
      ? t("notes.shine.brightness_heavy.body", { brightness: sci(L), life_vs_sun: lifeVsSun(run.forecastMyr) })
      : t("notes.shine.brightness_small.body", { brightness: sci(L), life_vs_sun: lifeVsSun(run.forecastMyr) })],
    [0.35, t("notes.shine.how_it_fuses.title"), `${route} ${future}`],
    [0.5, t("notes.shine.starlight.title"), b
      ? t("notes.shine.starlight_bubble.body", { edge_distance: length(b.now) })
      : t("notes.shine.starlight_cool.body")],
    [0.7, t("notes.shine.helium_ash.title"), t("notes.shine.helium_ash.body")],
    [0.9, t("notes.shine.running_low.title"), t("notes.shine.running_low.body")],
  ];
  if (b) notes.push([Math.max(0.12, b.stallShare), t("notes.shine.bubble_stalls.title"), t("notes.shine.bubble_stalls.body", { edge_distance: length(b.end) })]);
  return notes.sort((x, y) => x[0] - y[0]);
}
